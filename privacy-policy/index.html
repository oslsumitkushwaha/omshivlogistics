    <h1>Privacy policy</h1>
    <p>This policy explains what happens to information submitted through omshivlogistics.com. It covers information you choose to send us and the analytics data collected automatically as you browse.</p>
    <h2>Information you send us</h2>
    <p>When you call, email or submit the request-a-quote form, you may give us your name, company, phone number, email address, and details of your consignment such as origin, destination, material, weight and preferred loading date. We use this only to respond to your enquiry, prepare a quotation and — if you engage us — to operate the transport service you have requested.</p>
    <h2>Analytics and cookies</h2>
    <p>This site uses Google Analytics 4 (measurement ID G-4H9SDR2W89) to understand how visitors find and use the pages. Google Analytics sets cookies and collects information such as your approximate location, the pages you view, how you arrived and which device you used. You can block or delete cookies in your browser settings, and blocking analytics cookies does not prevent you from using any part of this site.</p>
    <h2>What we do not do</h2>
    <ul>
      <li>We do not sell, rent or trade your information</li>
      <li>We do not share consignment details outside the operators carrying out your movement</li>
      <li>We do not add you to marketing lists because you requested a quote</li>
    </ul>
    <h2>Your choices</h2>
    <p>You can ask us to show you the enquiry information we hold about you, correct it, or delete it. Contact <a href="mailto:gandhidham@omshivlogistics.com">gandhidham@omshivlogistics.com</a> or call <a href="tel:+919374529413">+91 93745 29413</a>.</p>
    <p>Registered office: North Flour Mill Building, Office No. 203, Zhanda Chowk, Gandhidham 370201, Kutch, Gujarat, India.</p>
