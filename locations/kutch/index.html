    <h1>Transport services across Kutch</h1>
    <p>Kutch is our home ground. Om Shiv Logistics is based in Gandhidham and works the district as standing business — supplying commercial vehicles, booking 32FT container capacity and running road freight for manufacturing units, extraction industries and distribution plants.</p>
    <h2>The freight we handle here</h2>
    <ul>
      <li>Minerals and processed materials moving out of extraction and processing sites</li>
      <li>Industrial gas and steel consignments on multi-axle and trailer units</li>
      <li>Geosynthetics and construction materials to project sites</li>
      <li>Agro-processing and consumer goods on regular distribution lanes</li>
      <li>Containerised export-import cargo routed to Kandla and Mundra</li>
    </ul>
    <h2>Distances, routes and honest timelines</h2>
    <p>Freight planning in Kutch is mostly a question of honest transit estimation. We plan routes against the season, account for checkpost behaviour and toll points, and tell clients what a run will realistically take.</p>
