    <h1>About Om Shiv Logistics</h1>
    <p>A business-to-business fleet owner and transport contractor working out of Gandhidham, Kutch — not a consumer moving company. Tagline: Transportation Redefined — Your Cargo, Our Responsibility.</p>
    <h2>What we do</h2>
    <ul>
      <li>Commercial vehicle supply — 500+ vehicles including multi-axle, trailer, open-body and LCV</li>
      <li>Container booking and confirmation — 32FT SXL (9MT) and MXL (18MT)</li>
      <li>Road transport — full truck load and part truck load</li>
      <li>End-to-end transport contracting with dedicated trucks and fixed pricing structures</li>
      <li>Commission agency and vehicle sourcing during demand peaks</li>
      <li>Fleet and dispatch management with credentialed drivers and 24/7 support lines</li>
    </ul>
    <h2>Where we work</h2>
    <p>Our registered office is in Gandhidham, and the Kutch belt is our home ground — inside the Kandla and Mundra port cluster. From Gandhidham we run pickup and delivery across Gujarat and India, with active routes into Maharashtra, Rajasthan, Delhi NCR, Tamil Nadu, Karnataka, Andhra Pradesh and West Bengal.</p>
    <h2>Leadership</h2>
    <p>Om Shiv Logistics is led by Indradev Kushwaha, founder and fleet owner. He owns and operates 32FT SXL and MXL container capacity and works directly with the businesses we move for.</p>
    <h2>How to reach us</h2>
    <p>Transport Booking <a href="tel:+919374529413">+91 93745 29413</a> · Fleet &amp; Dispatch <a href="tel:+919374429413">+91 93744 29413</a> · Operations &amp; Support <a href="tel:+919274047949">+91 92740 47949</a>. Email <a href="mailto:gandhidham@omshivlogistics.com">gandhidham@omshivlogistics.com</a> or <a href="mailto:contact@omshivlogistics.com">contact@omshivlogistics.com</a>. Registered office: North Flour Mill Building, Office No. 203, Zhanda Chowk, Gandhidham 370201, Kutch, Gujarat, India.</p>
