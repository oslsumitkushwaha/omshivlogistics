    <h1>FTL and PTL road transport</h1>
    <p>Full truck load for exclusive, direct movement and part truck load when your consignment does not justify a whole vehicle. Based in Gandhidham, Kutch with pickup and delivery across India.</p>
    <h2>Full truck load (FTL)</h2>
    <p>The vehicle is dedicated to your consignment and runs from your pickup point to your delivery point without consolidation. Suited to heavy bulk, project cargo, machinery and time-critical deliveries.</p>
    <h2>Part truck load (PTL)</h2>
    <p>You pay for the space your consignment occupies. Suited to smaller volumes where per-consignment cost matters more than exclusivity.</p>
    <h2>Vehicle classes we place</h2>
    <ul>
      <li>10-tyre and above trucks, multi-axle units and trailers</li>
      <li>Open-body and flatbed variants for over-dimensional loads</li>
      <li>Light commercial vehicles for intra-city and mid-mile cycles</li>
      <li>32FT SXL (9MT) and MXL (18MT) containers</li>
    </ul>
