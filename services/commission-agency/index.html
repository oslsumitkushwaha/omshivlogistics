    <h1>Commission agency and vehicle sourcing</h1>
    <p>An intermediary logistics arm that bridges capacity gaps using regional networks built over years in Kutch.</p>
    <h2>What we do</h2>
    <ul>
      <li>Rapid sourcing of certified backup fleets when your own capacity runs short</li>
      <li>Route planning that accounts for seasonal conditions, toll and checkpost behaviour</li>
      <li>Additional capacity during demand peaks, without permanent overhead</li>
      <li>Transparent, ethics-first intermediation — the rate we agree is the rate you pay</li>
    </ul>
    <h2>Why an agency rather than a bigger fleet</h2>
    <p>Keeping a fleet large enough to cover your worst week means paying for that capacity in every quiet week. A commission agency lets you buy capacity only when you need it.</p>
