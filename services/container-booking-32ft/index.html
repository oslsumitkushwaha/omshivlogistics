    <h1>32FT container booking: SXL and MXL</h1>
    <p>Long 32FT containers for dense and volume industrial freight, booked out of Gandhidham for pickup and delivery across India. Om Shiv Logistics owns and operates 32FT container capacity.</p>
    <h2>SXL (9MT) or MXL (18MT)?</h2>
    <p>SXL class containers are the lighter option at around 9MT gross; MXL class containers carry roughly 18MT gross on a multi-axle configuration. The right choice depends on consignment weight, dispatch bay length and what your consignee can legally receive.</p>
    <h2>What this service covers</h2>
    <ul>
      <li>32FT SXL (9MT) and MXL (18MT) container booking and confirmation</li>
      <li>Single-axle and multi-axle long containers matched to cargo density</li>
      <li>Pickup from factory, warehouse or ICD and delivery to the named destination</li>
      <li>Port-linked container movement for the Kandla and Mundra cluster</li>
    </ul>
    <h2>Booking a container</h2>
    <p>Have ready: pickup and receiving addresses, goods description, approximate gross weight, package count, container class and preferred loading date. Call <a href="tel:+919374529413">+91 93745 29413</a> or email <a href="mailto:gandhidham@omshivlogistics.com">gandhidham@omshivlogistics.com</a>.</p>
    <p>Registered office: North Flour Mill Building, Office No. 203, Zhanda Chowk, Gandhidham 370201, Kutch, Gujarat, India.</p>
