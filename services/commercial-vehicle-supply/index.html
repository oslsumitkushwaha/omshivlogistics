    <h1>Commercial vehicle supply</h1>
    <p>The right vehicle for the load, placed at your gate — multi-axle trucks, trailers, open-body units, LCVs and 32FT containers. We are a fleet owner as well as a supplier, with a network of more than 500 commercial vehicles.</p>
    <h2>Vehicle categories</h2>
    <ul>
      <li>Multi-axle trucks — heavy tonnage and dense bulk cargo</li>
      <li>Trailers — bulk raw material, machinery and high-tonnage loads</li>
      <li>Open-body and flatbed units — over-dimensional and awkward loads</li>
      <li>Light commercial vehicles — intra-city and mid-mile cycles</li>
      <li>32FT containers (SXL 9MT / MXL 18MT) — sealed, weatherproof movement</li>
    </ul>
    <h2>What to tell us</h2>
    <ul>
      <li>Origin and destination</li>
      <li>Material and approximate gross weight</li>
      <li>The largest item's dimensions, if the load is over-dimensional</li>
      <li>Loading date, and whether the dispatch bay has any access limit</li>
      <li>Whether the load must be sealed (container) or can travel open-body</li>
    </ul>
    <p>Call <a href="tel:+919374529413">+91 93745 29413</a> or email <a href="mailto:gandhidham@omshivlogistics.com">gandhidham@omshivlogistics.com</a>. Registered office: North Flour Mill Building, Office No. 203, Zhanda Chowk, Gandhidham 370201, Kutch, Gujarat, India.</p>
